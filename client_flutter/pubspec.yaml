name: alertly
description: "Alertly - Community alert platform."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.7.0

dependencies:
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_riverpod: <3.0.0
  geolocator: ^13.0.2
  go_router: ^17.0.0
  google_fonts: ^6.3.2
  http: ^1.6.0
  mapbox_maps_flutter: ^2.22.0
  supabase_flutter: ^2.12.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_foreground: assets/app_icon_foreground.png
  adaptive_icon_background: "#006D77"
  remove_alpha_ios: true
